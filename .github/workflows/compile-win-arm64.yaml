name: isoextract-win-arm64

# Per-architecture compile + test for win-arm64. Thin wrapper that delegates to the reusable
# base workflow (compile.yaml).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-win-arm64.yaml'
      - '.github/workflows/compile.yaml'
      - 'src/**'
      - 'build.sh'
      - 'tests/data/**'

jobs:
  compile:
    uses: ./.github/workflows/compile.yaml
    with:
      rid: win-arm64
      os: windows-11-arm
